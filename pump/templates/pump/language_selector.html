{% load i18n %}{% get_current_language as interface_language %}<form method="post" action="{% url 'interface_language' %}" class="language-selector">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><label for="interface-language">{% translate "Language" %}</label><select id="interface-language" name="language"><option value="en"{% if interface_language == 'en' %} selected{% endif %}>English</option><option value="hi"{% if interface_language == 'hi' %} selected{% endif %}>हिन्दी</option></select><button type="submit">{% translate "Apply" %}</button></form>
