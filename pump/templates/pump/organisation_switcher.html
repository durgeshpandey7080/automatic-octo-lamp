{% load i18n interface %}{% if station_links %}<details class="organisation-switcher"><summary aria-label="Switch organisation"><span class="switcher-label">{% translate "Organisation" %}</span>{% include 'pump/station_logo.html' with code=station_code %}<strong>{{ station_name }}</strong><span class="switcher-chevron" aria-hidden="true">⌄</span></summary><div class="organisation-menu"><p>{% translate "Switch organisation" %}</p>{% for station in station_links %}<form method="post" action="{% url 'select_organisation' %}">{% csrf_token %}<input type="hidden" name="organisation" value="{{ station.code }}"><button type="submit"{% if station.code == station_code %} disabled aria-current="true"{% endif %}>{% include 'pump/station_logo.html' with code=station.code %}<span class="station-menu-name">{{ station.name }}</span>{% if station.code == station_code %}<small>{% translate "Current" %}</small>{% else %}<span aria-hidden="true">↗</span>{% endif %}</button></form>{% endfor %}</div></details>{% endif %}
