server {
 listen 80;
 server_name localhost;
 location /station2/ {
  proxy_pass http://station2:8000/;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location / {
  proxy_pass http://web:8000;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
}
